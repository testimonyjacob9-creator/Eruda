<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a2380">
<title>Admin · Erudite Easy Pay</title>
<link rel="icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1d4ed8;--b2:#2f6bff;--nv:#0a2380;--bg:#f4f7ff;--c:#fff;--tx:#0b1b3f;--m:#64748b;--l:#e3eaf8;--s:#eaf1ff;--ok:#16a34a;--er:#dc2626;--wn:#d97706;--sh:0 8px 24px rgba(29,78,216,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#060f2b;--c:#0d1a42;--tx:#eaf0ff;--m:#93a4c9;--l:#1b2b5e;--s:#12234f;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea,select{font:inherit;color:inherit}
svg{width:20px;height:20px;flex:none}.hide{display:none!important}
.lg{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--nv),var(--b) 60%,var(--b2));padding:20px}
.lc{background:var(--c);border-radius:24px;padding:28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em}.brand i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--nv),var(--b2));display:grid;place-items:center;color:#fff;font-style:normal}
.brand small{display:block;font-size:10px;letter-spacing:.25em;color:var(--m)}
input,textarea,select{width:100%;border:1.5px solid var(--l);border-radius:12px;padding:12px 14px;background:var(--bg);outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(47,107,255,.15)}
textarea{min-height:130px;resize:vertical}label{display:block;font-size:12px;font-weight:700;color:var(--m);margin:14px 0 6px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--b),var(--b2));cursor:pointer;box-shadow:0 8px 18px rgba(29,78,216,.28)}
.btn.g{background:var(--s);color:var(--b);box-shadow:none}.btn.r{background:rgba(220,38,38,.1);color:var(--er);box-shadow:none}.btn.sm{padding:7px 12px;font-size:12px;border-radius:9px}.btn:disabled{opacity:.6}
.app{display:flex;min-height:100vh}
.side{width:250px;background:linear-gradient(180deg,var(--nv),#0b2fa8);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:30;transition:.25s;overflow:auto}
.side .brand{color:#fff;padding:0 8px 22px}.side .brand small{color:#b9c9ff}
.nv{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#cdd9ff;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;margin-bottom:4px;text-align:left}
.nv.on{background:rgba(255,255,255,.15);color:#fff}.nv:hover{background:rgba(255,255,255,.08)}
.main{flex:1;margin-left:250px;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--c);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:20}
.top h1{font-size:19px;flex:1}.mb{display:none;border:1px solid var(--l);background:var(--c);border-radius:10px;width:40px;height:40px;place-items:center;cursor:pointer}
.pg{padding:22px;max-width:1200px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.cd{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:18px;box-shadow:var(--sh);min-width:0}
.cd h3{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.st small{color:var(--m);font-weight:700;font-size:12px}.st b{display:block;font-size:26px;margin:6px 0 2px;letter-spacing:-.5px}.st span{font-size:12px;color:var(--m)}
.st i{float:right;width:40px;height:40px;border-radius:12px;background:var(--s);color:var(--b);display:grid;place-items:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--m);padding:10px;border-bottom:1px solid var(--l)}
td{padding:12px 10px;border-bottom:1px solid var(--l);font-size:13px}tr:last-child td{border:0}
.tg{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;background:var(--s);color:var(--b);margin-right:4px}
.tg.ok{background:rgba(22,163,74,.12);color:var(--ok)}.tg.er{background:rgba(220,38,38,.1);color:var(--er)}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar div{width:100%;max-width:46px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--b2),var(--b));min-height:4px}.bar small{font-size:11px;color:var(--m)}.bar em{font-style:normal;font-size:10px;color:var(--m)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ch{display:flex;gap:10px;flex-wrap:wrap}
.ck{flex:1;min-width:120px;border:1.5px solid var(--l);border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700;background:var(--bg)}
.ck.on{border-color:var(--b);background:var(--s);color:var(--b)}.ck input{display:none}
.pv{background:var(--bg);border:1px dashed var(--l);border-radius:16px;padding:14px;margin-bottom:12px}
.pn{display:flex;gap:10px;background:var(--c);border-radius:14px;padding:12px;box-shadow:var(--sh);border:1px solid var(--l)}.pn i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--nv),var(--b2));flex:none}
.pn b{display:block;font-size:13px}.pn span{font-size:12px;color:var(--m);word-break:break-word}
.sy{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--l)}.sy:last-child{border:0}.sy small{color:var(--m);display:block}
code{background:var(--s);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
.tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;z-index:99}
.sc{position:fixed;inset:0;background:rgba(6,15,43,.5);z-index:25}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none}.main{margin-left:0}.mb{display:grid}.g4{grid-template-columns:1fr 1fr}.g2,.g2e{grid-template-columns:1fr}.pg{padding:14px}.top{padding:12px 14px}}
</style></head><body>

<div class="lg" id="lg"><div class="lc"><div class="brand"><i>E</i><div>ERUDITE<small>ADMIN CONSOLE</small></div></div>
<label>Admin password</label><input id="pw" type="password" placeholder="Enter password" autocomplete="current-password">
<div id="le" style="color:var(--er);font-size:12px;font-weight:600;min-height:18px;margin:8px 0"></div><button class="btn" style="width:100%" id="lb">Sign in</button></div></div>

<div class="app hide" id="ap">
<aside class="side" id="sd"><div class="brand"><i>E</i><div>ERUDITE<small>ADMIN CONSOLE</small></div></div><div id="nav"></div>
<button class="nv" id="out" style="margin-top:24px">⎋ Sign out</button></aside>
<div class="sc hide" id="sc"></div>
<div class="main"><div class="top"><button class="mb" id="mb">☰</button><h1 id="ttl">Dashboard</h1><button class="btn g sm" id="rf">Refresh</button></div><div class="pg" id="pg"></div></div>
</div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),N=n=>'₦'+Number(n||0).toLocaleString('en-NG'),D=t=>new Date(t).toLocaleString('en-NG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const tok=()=>{try{return localStorage.getItem('eep_admin')}catch(e){return null}};
const PAGES=[['dash','◧','Dashboard'],['users','☺','Users'],['txs','₦','Transactions'],['price','%','Pricing'],['bc','✉','Broadcast'],['hist','☰','Message history'],['sys','⚙','System & setup']];
let page='dash',cache={};
const toast=m=>{const t=document.createElement('div');t.className='tt';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)};
async function A(p,o={}){const r=await fetch('/api/admin/'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok()}});if(r.status===401&&p!=='login'){out();throw 0}const j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function out(){try{localStorage.removeItem('eep_admin')}catch(e){}$('#ap').classList.add('hide');$('#lg').classList.remove('hide')}
$('#lb').onclick=async()=>{$('#lb').disabled=true;$('#le').textContent='';try{const r=await A('login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});localStorage.setItem('eep_admin',r.token);start()}catch(e){$('#le').textContent=e.message||'Login failed'}$('#lb').disabled=false};
$('#pw').onkeydown=e=>e.key=='Enter'&&$('#lb').click();$('#out').onclick=out;
const side=o=>{$('#sd').classList.toggle('open',o);$('#sc').classList.toggle('hide',!o)};$('#mb').onclick=()=>side(true);$('#sc').onclick=()=>side(false);
function nav(){$('#nav').innerHTML=PAGES.map(p=>`<button class="nv ${p[0]==page?'on':''}" data-p="${p[0]}"><span style="width:20px;text-align:center">${p[1]}</span>${p[2]}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.p;side(false);go()})}
$('#rf').onclick=()=>go();
function start(){$('#lg').classList.add('hide');$('#ap').classList.remove('hide');go()}
async function go(){nav();$('#ttl').textContent=PAGES.find(p=>p[0]==page)[2];$('#pg').oninput=$('#pg').onclick=null;$('#pg').innerHTML='<div class="cd">Loading…</div>';try{await R[page]()}catch(e){if(e)$('#pg').innerHTML=`<div class="cd" style="color:var(--er)">${esc(e.message)}</div>`}}
const modal=h=>{const o=document.createElement('div');o.className='sc';o.style.cssText='display:grid;place-items:center;padding:16px';o.innerHTML=`<div class="cd" style="width:100%;max-width:460px;max-height:90vh;overflow:auto">${h}</div>`;o.onclick=e=>{if(e.target==o)o.remove()};document.body.appendChild(o);return o};
async function walletModal(u){const w=await A('wallet?uid='+encodeURIComponent(u.id));const o=modal(`<h3>${esc(u.name||u.id)} · wallet</h3><div style="font-size:28px;font-weight:800;margin-bottom:12px">${N(w.balance)}</div><div class="row"><input id="wa" type="number" placeholder="Amount (negative = debit)" style="flex:1;min-width:150px"><input id="wn" placeholder="Note" style="flex:1;min-width:120px"></div><button class="btn" id="wg" style="margin:12px 0">Apply adjustment</button><h3>Recent activity</h3>${w.items.slice(0,15).map(x=>`<div class="sy"><div><b>${esc(x.title)}</b><small>${esc(x.sub||'')} · ${D(x.ts)}</small></div><b style="color:${x.amount>0?'var(--ok)':'var(--tx)'}">${x.amount>0?'+':'−'}${N(Math.abs(x.amount))}</b></div>`).join('')||'<span style="color:var(--m)">No activity yet</span>'}`);
o.querySelector('#wg').onclick=async()=>{const amount=+o.querySelector('#wa').value;if(!amount)return toast('Enter an amount');if(!confirm(`${amount>0?'Credit':'Debit'} ${N(Math.abs(amount))}?`))return;try{await A('wallet',{method:'POST',body:JSON.stringify({uid:u.id,amount,note:o.querySelector('#wn').value})});toast('Wallet updated');o.remove();walletModal(u)}catch(e){toast(e.message)}}}
const stat=(l,v,s,i)=>`<div class="cd st"><i>${i}</i><small>${l}</small><b>${v}</b><span>${s}</span></div>`;
const chan=r=>['app','email','push'].filter(k=>r.channels?.[k]).map(k=>`<span class="tg">${k}</span>`).join('');
const sentTxt=r=>Object.entries(r.sent||{}).map(([k,v])=>`${k}: ${v.sent||0}${v.failed?` (<span style="color:var(--er)">${v.failed} failed</span>)`:''}`).join(' · ');
const R={
async dash(){const s=await A('stats');cache.s=s;const mx=Math.max(...s.series.map(x=>x.sales),1);
$('#pg').innerHTML=`<div class="grid g4">${stat('Registered users',s.users,s.withEmail+' with email','☺')}${stat('Push subscribers',s.subs,'devices reachable','🔔')}${stat('Total sales',N(s.revenue),s.txCount+' transactions','₦')}${stat('Wallet funded',N(s.funded),s.fundCount+' Paystack payments','💳')}</div>
<div class="grid g2" style="margin-top:16px"><div class="cd"><h3>Sales · last 7 days</h3><div class="bars">${s.series.map(x=>`<div class="bar"><em>${x.sales?N(x.sales):''}</em><div style="height:${Math.max(x.sales/mx*100,2)}%"></div><small>${x.d.slice(5)}</small></div>`).join('')}</div></div>
<div class="cd"><h3>System health</h3>${[['Admin login',s.status.admin],['Brevo email',s.status.brevo],['Web push (VAPID)',s.status.vapid],['Paystack payments',s.status.paystack],['AI assistant',s.status.chat]].map(a=>`<div class="sy"><b>${a[0]}</b><span class="tg ${a[1]?'ok':'er'}">${a[1]?'Ready':'Not set'}</span></div>`).join('')}<button class="btn g sm" style="margin-top:12px" onclick="page='sys';go()">Setup guide</button></div></div>
<div class="grid g2e" style="margin-top:16px"><div class="cd"><h3>Recent transactions</h3><div class="tw"><table><tr><th>Service</th><th>To</th><th>Amount</th></tr>${s.recentTx.map(t=>`<tr><td>${esc(t.service)}</td><td>${esc(t.recipient)}</td><td><b>${N(t.amount)}</b></td></tr>`).join('')||'<tr><td colspan=3 style="color:var(--m)">No transactions yet</td></tr>'}</table></div></div>
<div class="cd"><h3>Recent broadcasts <button class="btn sm" onclick="page='bc';go()">New</button></h3>${s.recentBc.map(r=>`<div class="sy"><div><b>${esc(r.title)}</b><small>${D(r.ts)} · ${sentTxt(r)}</small></div><div>${chan(r)}</div></div>`).join('')||'<span style="color:var(--m)">Nothing sent yet</span>'}</div></div>`},
async users(){const r=await A('users');cache.u=r.items;const draw=q=>{const l=cache.u.filter(u=>(u.name+u.id+u.email).toLowerCase().includes(q.toLowerCase()));$('#ut').innerHTML=l.map(u=>`<tr><td><b>${esc(u.name||'—')}</b>${u.suspended?' <span class="tg er">suspended</span>':''}</td><td>${esc(u.id)}</td><td>${esc(u.email)||'<span style="color:var(--m)">—</span>'}</td><td>${D(u.joined)}</td><td style="white-space:nowrap"><button class="btn g sm" data-w="${esc(u.id)}">Wallet</button> ${u.hasPin?`<button class="btn g sm" data-p="${esc(u.id)}">Reset PIN</button> `:''}<button class="btn g sm" data-s="${esc(u.id)}">${u.suspended?'Activate':'Suspend'}</button> <button class="btn r sm" data-d="${esc(u.id)}">Remove</button></td></tr>`).join('')||'<tr><td colspan=5 style="color:var(--m)">No users found</td></tr>';$('#uc').textContent=l.length+' user(s)';$('#ut').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>walletModal(cache.u.find(x=>x.id==b.dataset.w)));$('#ut').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this user’s PIN? They will be asked to create a new one.'))return;await A('users/resetpin',{method:'POST',body:JSON.stringify({id:b.dataset.p})});toast('PIN reset');R.users()});$('#ut').querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const u=cache.u.find(x=>x.id==b.dataset.s);await A('users/suspend',{method:'POST',body:JSON.stringify({id:u.id,on:!u.suspended})});toast(u.suspended?'User activated':'User suspended');R.users()});$('#ut').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this user?')){await A('users?id='+encodeURIComponent(b.dataset.d),{method:'DELETE'});toast('User removed');R.users()}})};
$('#pg').innerHTML=`<div class="cd"><div class="row" style="margin-bottom:14px"><input id="uq" placeholder="Search name, phone or email…" style="flex:1;min-width:200px"><span id="uc" class="tg"></span></div><div class="tw"><table><tr><th>Name</th><th>Login ID</th><th>Email</th><th>Joined</th><th></th></tr><tbody id="ut"></tbody></table></div></div>`;draw('');$('#uq').oninput=e=>draw(e.target.value)},
async txs(){const r=await A('txs');const draw=q=>{const l=r.items.filter(t=>(t.service+t.recipient+t.ref+t.uid).toLowerCase().includes(q.toLowerCase()));$('#tt').innerHTML=l.map(t=>`<tr><td><code>${esc(t.ref)}</code></td><td>${esc(t.service)}</td><td>${esc(t.recipient)}</td><td>${esc(t.uid)}</td><td><b>${N(t.amount)}</b></td><td>${D(t.ts)}</td><td>${t.refunded?'<span class="tg">refunded</span>':`<button class="btn r sm" data-r="${esc(t.ref)}">Refund</button>`}</td></tr>`).join('')||'<tr><td colspan=7 style="color:var(--m)">No transactions</td></tr>';$('#tc').textContent=l.length+' · '+N(l.reduce((s,t)=>s+t.amount,0));$('#tt').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!confirm('Refund this transaction to the user wallet?'))return;try{await A('refund',{method:'POST',body:JSON.stringify({ref:b.dataset.r})});toast('Refunded');R.txs()}catch(e){toast(e.message)}})};
$('#pg').innerHTML=`<div class="cd"><div class="row" style="margin-bottom:14px"><input id="tq" placeholder="Search reference, service, number…" style="flex:1;min-width:200px"><span id="tc" class="tg"></span></div><div class="tw"><table><tr><th>Ref</th><th>Service</th><th>Recipient</th><th>User</th><th>Amount</th><th>Time</th><th></th></tr><tbody id="tt"></tbody></table></div></div>`;draw('');$('#tq').oninput=e=>draw(e.target.value)},
async bc(){const s=cache.s||await A('stats');cache.s=s;
$('#pg').innerHTML=`<div class="grid g2"><div class="cd"><h3>Compose message</h3><label style="margin-top:0">Send via</label><div class="ch" id="chs">${[['app','In-app inbox','Everyone who opens the app'],['email','Email (Brevo)',s.withEmail+' users with email'],['push','Push notification',s.subs+' subscribed devices']].map(c=>`<label class="ck on" data-k="${c[0]}" style="margin:0"><input type="checkbox" checked><span>${c[1]}<small style="display:block;font-weight:500;color:var(--m)">${c[2]}</small></span></label>`).join('')}</div>
<label>Title</label><input id="bt" maxlength="80" placeholder="e.g. Cheaper data this weekend"><label>Message</label><textarea id="bm" maxlength="2000" placeholder="Write your message…"></textarea><div class="row" style="margin-top:16px"><button class="btn" id="bs">Send to everyone</button><span id="bn" style="color:var(--m);font-size:12px"></span></div></div>
<div class="cd"><h3>Live preview</h3><label style="margin-top:0">Push notification</label><div class="pv"><div class="pn"><i></i><div><b id="p1">Title</b><span id="p2">Your message appears here</span></div></div></div><label>Email</label><div class="pv" style="padding:0;overflow:hidden"><div style="background:linear-gradient(135deg,var(--nv),var(--b2));color:#fff;padding:14px;font-weight:800;letter-spacing:.14em;font-size:12px">ERUDITE EASY PAY</div><div style="padding:14px;background:var(--c)"><b id="e1">Title</b><p id="e2" style="color:var(--m);margin-top:6px;white-space:pre-wrap">Your message appears here</p></div></div></div></div>`;
$('#chs').querySelectorAll('.ck').forEach(l=>l.onclick=e=>{e.preventDefault();l.classList.toggle('on');l.querySelector('input').checked=l.classList.contains('on')});
const up=()=>{$('#p1').textContent=$('#e1').textContent=$('#bt').value||'Title';$('#p2').textContent=$('#e2').textContent=$('#bm').value||'Your message appears here';$('#bn').textContent=$('#bm').value.length+'/2000'};$('#bt').oninput=$('#bm').oninput=up;
$('#bs').onclick=async()=>{const ch={};$('#chs').querySelectorAll('.ck').forEach(l=>ch[l.dataset.k]=l.classList.contains('on'));const title=$('#bt').value.trim(),message=$('#bm').value.trim();
if(!title||!message)return toast('Add a title and message');if(!ch.app&&!ch.email&&!ch.push)return toast('Pick a channel');
if(!confirm(`Send "${title}" to everyone via ${Object.keys(ch).filter(k=>ch[k]).join(', ')}?`))return;
$('#bs').disabled=true;$('#bs').textContent='Sending…';try{const r=await A('broadcast',{method:'POST',body:JSON.stringify({title,message,channels:ch})});toast('Sent · '+Object.entries(r.record.sent).map(([k,v])=>k+' '+(v.sent||0)).join(', '));$('#bt').value=$('#bm').value='';up()}catch(e){toast(e.message)}$('#bs').disabled=false;$('#bs').textContent='Send to everyone'}},
async price(){const P=await A('pricing'),st={data:[...P.plans.data],tv:[...P.plans.tv],exam:[...P.plans.exam]};
const tg=k=>`<label style="display:inline-flex;gap:8px;align-items:center;margin:0;font-size:12px"><input type="checkbox" style="width:auto" data-off="${k}" ${P.off&&P.off[k]?'':'checked'}> Enabled</label>`;
const box=(k,t)=>`<div class="cd" style="margin-top:16px"><h3>${t}${tg(k)}</h3><div id="pl-${k}"></div><button class="btn g sm" data-add="${k}">+ Add plan</button></div>`;
$('#pg').innerHTML=`<div class="grid g2e"><div class="cd"><h3>Airtime${tg('airtime')}</h3><label style="margin-top:0">Discount given to users (%)</label><input id="ad" type="number" min="0" max="30" step="0.1" value="${P.airtimeDiscount}"><p style="color:var(--m);font-size:12px;margin-top:8px">Users pay face value minus this. Keep it below your provider’s discount so you keep the difference.</p></div><div class="cd"><h3>Electricity${tg('power')}</h3><p style="color:var(--m)">Charged at face value.</p></div></div>${box('data','Data plans')}${box('tv','Cable TV packages')}${box('exam','Exam pins')}<div style="margin-top:16px"><button class="btn" id="sv">Save pricing</button></div>`;
const draw=k=>{$('#pl-'+k).innerHTML=st[k].map((x,i)=>`<div class="row" style="margin-bottom:8px"><input data-k="${k}" data-i="${i}" data-f="label" value="${esc(x.label)}" placeholder="Plan name" style="flex:2;min-width:140px"><input data-k="${k}" data-i="${i}" data-f="price" type="number" value="${x.price}" placeholder="₦ price" style="flex:1;min-width:90px"><button class="btn r sm" data-x="${k}:${i}">✕</button></div>`).join('')};['data','tv','exam'].forEach(draw);
$('#pg').oninput=e=>{const d=e.target.dataset;if(d.f)st[d.k][+d.i][d.f]=d.f=='price'?+e.target.value:e.target.value};
$('#pg').onclick=e=>{const d=e.target.dataset;if(d.x){const[k,i]=d.x.split(':');st[k].splice(+i,1);draw(k)}if(d.add){st[d.add].push({label:'',price:0});draw(d.add)}};
$('#sv').onclick=async()=>{const off={};document.querySelectorAll('[data-off]').forEach(c=>off[c.dataset.off]=!c.checked);try{await A('pricing',{method:'POST',body:JSON.stringify({airtimeDiscount:+$('#ad').value,off,plans:st})});toast('Pricing saved and live')}catch(e){toast(e.message)}}},
async hist(){const r=await A('broadcasts');$('#pg').innerHTML=`<div class="cd"><div class="tw"><table><tr><th>Sent</th><th>Title</th><th>Channels</th><th>Delivery</th><th></th></tr>${r.items.map(x=>`<tr><td>${D(x.ts)}</td><td><b>${esc(x.title)}</b><br><small style="color:var(--m)">${esc(x.message.slice(0,90))}</small></td><td>${chan(x)}</td><td>${sentTxt(x)}</td><td><button class="btn r sm" data-d="${x.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan=5 style="color:var(--m)">No broadcasts yet</td></tr>'}</table></div></div>`;
$('#pg').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this message? It will disappear from user inboxes too.')){await A('broadcasts?id='+b.dataset.d,{method:'DELETE'});R.hist()}})},
async sys(){const s=await A('stats');const row=(n,ok,d)=>`<div class="sy"><div><b>${n}</b><small>${d}</small></div><span class="tg ${ok?'ok':'er'}">${ok?'Ready':'Missing'}</span></div>`;
$('#pg').innerHTML=`<div class="grid g2e"><div class="cd"><h3>Status</h3>${row('ADMIN_PASSWORD',s.status.admin,'Password for this console')}${row('BREVO_API_KEY + SENDER_EMAIL',s.status.brevo,s.status.sender?'Sender: '+esc(s.status.sender):'Verified sender in Brevo')}${row('VAPID_PRIVATE_KEY',s.status.vapid,'Private half of the push key')}${row('PAYSTACK_SECRET_KEY',s.status.paystack,'Wallet funding via Paystack')}${row('ANTHROPIC_API_KEY',s.status.chat,'Smart chat assistant (falls back to basic FAQ without it)')}</div>
<div class="cd"><h3>Netlify environment variables</h3><p style="color:var(--m);margin-bottom:10px">Site configuration → Environment variables, then redeploy.</p><div class="sy"><div><code>ADMIN_PASSWORD</code><small>Your admin login password</small></div></div><div class="sy"><div><code>ADMIN_SECRET</code><small>Optional extra random string for tokens</small></div></div><div class="sy"><div><code>BREVO_API_KEY</code> <code>SENDER_EMAIL</code><small>Email broadcasts</small></div></div><div class="sy"><div><code>VAPID_PRIVATE_KEY</code><small>Push notifications</small></div></div><div class="sy"><div><code>PAYSTACK_SECRET_KEY</code><small>Paystack → Settings → API keys</small></div></div><div class="sy"><div><code>ANTHROPIC_API_KEY</code> <code>SUPPORT_WHATSAPP</code><small>Chat assistant and human-support button (e.g. 2348012345678)</small></div></div></div></div>
<div class="cd" style="margin-top:16px"><h3>Push public key (hardcoded in the app)</h3><code>${esc(s.vapidPublic)}</code></div>`}};
if(tok())start();
</script></body></html>
